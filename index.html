<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Web Calculator</title>
    <!-- CSS File Link -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="cointainer">
        <h1>Calculator</h1>
        
        <!-- Input Field Section -->
        <div class="input">
            <input type="text" placeholder="0" readonly>
        </div>

        <!-- Buttons Row 1 -->
        <div class="button">
            <button>AC</button>
            <button>M+</button>
            <button>M-</button>
            <button>/</button>
        </div>

        <!-- Buttons Row 2 -->
        <div class="button">
            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button>*</button>
        </div>

        <!-- Buttons Row 3 -->
        <div class="button">
            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button>-</button>
        </div>

        <!-- Buttons Row 4 -->
        <div class="button">
            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button>+</button>
        </div>

        <!-- Buttons Row 5 -->
        <div class="button">
            <button>0</button>
            <button>%</button>
            <button>=</button>
            <button>.</button>
        </div>
    </div>

    <!-- JavaScript File Link -->
    <script src="script.js"></script>
</body>
</html>
